<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Log In — TeleTriage</title>

  <!-- Bootstrap 5.3.8 & Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- External Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white">

  <div class="container-fluid p-0 min-vh-100 d-flex flex-column flex-lg-row">
    
    <!-- Left Hero Section with Background Texture & Illustration -->
    <div class="col-lg-6 position-relative p-4 p-md-5 d-flex flex-column justify-content-between overflow-hidden login-hero-bg">
      
      <!-- Top Branding and Language Switcher -->
      <div class="d-flex justify-content-between align-items-center z-10">
        <a class="d-flex align-items-center text-decoration-none text-white" href="index.html">
          <i class="bi bi-plus-square-fill fs-2 me-2"></i>
          <span class="fs-3 fw-bold">TeleTriage</span>
        </a>
        <button class="btn btn-sm text-white rounded-pill px-3 border border-white/40 lang-btn">
          EN | বাং
        </button>
      </div>

      <!-- Center Illustration Image -->
      <div class="my-auto text-center py-4 z-10">
        <img src="img/login_hero-left.png" alt="TeleTriage Medical Illustration" class="img-fluid max-w-md mx-auto drop-shadow-lg login-hero-img">
      </div>

      <div></div> <!-- Spacer -->
    </div>

    <!-- Right Login Form Section -->
    <div class="col-lg-6 d-flex align-items-center justify-content-center p-4 p-md-5 bg-white">
      <div class="w-100 login-form-wrapper">
        
        <h1 class="display-6 fw-bold brand-teal mb-1">Patient Log In</h1>
        <p class="text-secondary fw-medium mb-4 fs-5">Welcome back!</p>

        <!-- Alert Box (For showing validation errors) -->
        <div id="alertMsg" class="alert d-none py-2 text-start small mb-3" role="alert"></div>

        <form id="loginForm">
          <!-- Email Input -->
          <div class="mb-4">
            <input type="email" id="email" class="form-control form-control-lg rounded-3 input-gray py-3 px-4 fs-6" placeholder="E-mail Address" required>
          </div>

          <!-- Password Input -->
          <div class="mb-2 position-relative">
            <input type="password" id="password" class="form-control form-control-lg rounded-3 input-gray py-3 px-4 fs-6 pe-5" placeholder="Password" required>
            <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-secondary" id="togglePassword"></i>
          </div>

          <!-- Forgot Password Link -->
          <div class="text-end mb-4">
            <a href="#" class="brand-teal fw-semibold text-decoration-none small">Forgot password?</a>
          </div>

          <!-- Log In Button -->
          <button type="submit" class="btn btn-teal w-100 py-3 rounded-pill fw-bold fs-5 shadow-sm mb-4">
            Log In
          </button>

          <!-- Register Link -->
          <div class="text-center">
            <span class="text-secondary small">New to TeleTriage? </span>
            <a href="register.html" class="brand-teal fw-bold text-decoration-none small">Create an account</a>
          </div>
        </form>

      </div>
    </div>

  </div>

  <!-- External JavaScript File -->
  <script src="js/auth.js"></script>
</body>
</html>
