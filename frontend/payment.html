<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Gateway — TeleTriage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css?v=1.0">
</head>
<body class="bg-light" data-i18n-auto>

  <div class="d-flex min-vh-100 overflow-hidden">
    <!-- Sidebar Navigation -->
    <aside class="brand-bg text-white d-flex flex-column justify-content-between p-4" style="width: 260px; min-width: 260px;">
      <div>
        <a class="d-flex align-items-center text-decoration-none text-white mb-5" href="index.html">
          <i class="bi bi-plus-square-fill fs-2 me-2"></i>
          <span class="fs-3 fw-bold">TeleTriage</span>
        </a>
        <nav class="nav flex-column gap-2">
          <a class="nav-link sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="patient-dashboard.html">
            <i class="bi bi-house-door fs-5"></i> Dashboard
          </a>
          <a class="nav-link sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="symptom-form.html">
            <i class="bi bi-file-earmark-text fs-5"></i> Symptom Form
          </a>
          <a class="nav-link sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="triage-result.html">
            <i class="bi bi-activity fs-5"></i> Triage Result
          </a>
          <a class="nav-link sidebar-link active d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="payment.html">
            <i class="bi bi-credit-card fs-5"></i> Payment
          </a>
          <a class="nav-link sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="profile.html">
            <i class="bi bi-person fs-5"></i> Profile
          </a>
        </nav>
      </div>
      <div class="d-flex align-items-center justify-content-between pt-3 border-top border-white-20">
        <div class="d-flex align-items-center gap-2">
          <div class="bg-white text-dark rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 38px; height: 38px;">
            <i class="bi bi-person-fill fs-5" style="color: #187D85;"></i>
          </div>
          <div>
            <div class="fw-bold lh-1 small text-white" id="sidebarUserName">Patient</div>
            <small class="text-white-50" style="font-size: 0.72rem;">Patient</small>
          </div>
        </div>
        <a href="patient-login.html" class="btn btn-sm btn-light rounded-pill px-3 fw-bold" style="color: #187D85; font-size: 0.8rem;">Log Out</a>
      </div>
    </aside>

    <!-- Main Area -->
    <main class="flex-grow-1 d-flex flex-column" style="background: linear-gradient(135deg, #e0f2fe 0%, #ccfbf1 100%);">
      <header class="bg-white py-3 px-4 shadow-sm d-flex justify-content-between align-items-center">
        <div class="fw-semibold text-secondary" style="font-size: 0.95rem;">
          Patient <i class="bi bi-chevron-right mx-1 small"></i> <span style="color: #187D85;" class="fw-bold">Payment</span>
        </div>
        <button type="button" class="btn btn-sm text-white rounded-pill px-3" id="langToggle" style="background-color:#187D85;font-size:0.8rem;">EN | বাং</button>
      </header>

      <div class="p-4 p-md-5 overflow-auto flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="bg-white p-4 p-md-5 rounded-4 shadow-lg w-100 max-w-xl">
          <h2 class="fw-bold fs-3 text-slate-800 mb-4 text-center">Checkout & Payment</h2>

          <div id="sandboxInfo"></div>

          <!-- Consultation Duration -->
          <div class="mb-4">
            <label for="consultationDuration" class="form-label fw-bold text-slate-700">
              <i class="bi bi-clock-history me-1"></i> Consultation Duration (10–60 minutes)
            </label>
            <select id="consultationDuration" class="form-select form-select-lg rounded-3">
              <option value="10">10 minutes — 100 BDT</option>
              <option value="20">20 minutes — 200 BDT</option>
              <option value="30">30 minutes — 300 BDT</option>
              <option value="45">45 minutes — 450 BDT</option>
              <option value="60">60 minutes — 600 BDT (maximum)</option>
            </select>
            <small class="text-muted">Fee = 100 BDT per 10-minute block</small>
          </div>

          <!-- Booking Summary -->
          <div class="bg-slate-50 p-4 rounded-3 border mb-4">
            <h5 class="fw-bold text-slate-700 mb-3 border-bottom pb-2">Appointment Summary</h5>
            <div class="d-flex justify-content-between mb-2">
              <span class="text-muted">Selected Duration:</span>
              <strong id="summaryDuration" class="text-dark">10 Mins</strong>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span class="text-muted">Time Slot:</span>
              <strong id="summarySlot" class="text-dark">Priority Queue</strong>
            </div>
            <div class="d-flex justify-content-between fs-5 fw-bold border-top pt-2 text-teal-700">
              <span>Total Fee:</span>
              <span id="summaryFee">100 BDT</span>
            </div>
          </div>

          <!-- Select Payment Gateway -->
          <h5 class="fw-bold text-slate-700 mb-3">Select Payment Method</h5>
          <div class="row g-3 mb-4">
            <div class="col-6">
              <label class="border rounded-3 p-3 d-flex align-items-center justify-content-center gap-2 cursor-pointer w-100 bg-white hover:border-teal-500 shadow-sm">
                <input type="radio" name="paymentGateway" value="bKash" checked class="form-check-input">
                <span class="fw-bold text-pink-600 fs-5"><i class="bi bi-wallet2"></i> bKash</span>
              </label>
            </div>
            <div class="col-6">
              <label class="border rounded-3 p-3 d-flex align-items-center justify-content-center gap-2 cursor-pointer w-100 bg-white hover:border-teal-500 shadow-sm">
                <input type="radio" name="paymentGateway" value="SSLCommerz" class="form-check-input">
                <span class="fw-bold text-blue-600 fs-5"><i class="bi bi-credit-card-2-front"></i> SSLCommerz</span>
              </label>
            </div>
          </div>

          <button id="payNowBtn" class="btn btn-teal w-100 py-3 rounded-3 fw-bold fs-5 shadow">
            Pay Now & Confirm Booking
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/payment.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
