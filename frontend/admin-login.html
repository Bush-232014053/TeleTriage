<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Log In — TeleTriage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center" data-i18n-auto>
  <div class="position-fixed top-0 end-0 p-3" style="z-index:9999">
    <button type="button" class="btn btn-sm text-white rounded-pill px-3" id="langToggle" style="background-color:#187D85;">EN | বাং</button>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2" style="color:#187D85;">
            <i class="bi bi-plus-square-fill fs-2"></i>
            <span class="fs-3 fw-bold">TeleTriage</span>
          </a>
          <p class="text-muted small mt-2 mb-0">System Administrator Portal</p>
        </div>
        <div class="bg-white rounded-4 shadow-sm border p-4 p-md-5">
          <h1 class="fw-bold mb-1" style="color:#187D85;">Admin Log In</h1>
          <p class="text-muted mb-4">Manage doctors, patients, and applications</p>
          <div id="loginAlert" class="alert alert-danger d-none small"></div>
          <form id="adminLoginForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Username</label>
              <input type="text" id="adminUsername" class="form-control form-control-lg" placeholder="admin" required>
            </div>
            <div class="mb-4">
              <label class="form-label small fw-semibold">Password</label>
              <input type="password" id="adminPassword" class="form-control form-control-lg" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-lg w-100 text-white fw-bold rounded-3" style="background:#187D85;">Log In</button>
          </form>
          <p class="text-center text-muted small mt-4 mb-0">
            <a href="index.html" class="text-decoration-none" style="color:#187D85;">← Back to Home</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/admin-login-controller.js"></script>
</body>
</html>
