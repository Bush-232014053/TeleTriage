<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triage Result — TeleTriage</title>

  <!-- Bootstrap 5.3.8 & Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3.3">

  <style>
    /* Custom Styling for Severity Progress Bars */
    .severity-bar-container {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .severity-step {
      height: 12px;
      flex: 1;
      border-radius: 6px;
      opacity: 0.35;
      transition: all 0.3s ease;
    }
    .severity-step.active {
      opacity: 1;
      transform: scaleY(1.1);
    }
    .step-1 { background-color: #84cc16; } /* Non-urgent (Green) */
    .step-2 { background-color: #a3e635; } 
    .step-3 { background-color: #eab308; } /* Moderate (Yellow) */
    .step-4 { background-color: #f97316; } /* Urgent (Orange) */
    .step-5 { background-color: #dc2626; } /* Critical (Red) */
  </style>
</head>
<body class="bg-light">

  <div class="d-flex min-vh-100 overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="brand-bg text-white d-flex flex-column justify-content-between p-4" style="width: 260px; min-width: 260px;">
      <div>
        <a class="d-flex align-items-center text-decoration-none text-white mb-5" href="index.html">
          <i class="bi bi-plus-square-fill fs-2 me-2"></i>
          <span class="fs-3 fw-bold" style="font-family: 'Poppins', sans-serif;">TeleTriage</span>
        </a>

        <nav class="nav flex-column gap-2">
          <a class="nav-link sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="patient-dashboard.html">
            <i class="bi bi-house-door fs-5"></i> Dashboard
          </a>
          <a class="nav-link sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="symptom-form.html">
            <i class="bi bi-file-earmark-text fs-5"></i> Symptom Form
          </a>
          <a class="nav-link sidebar-link active d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="triage-result.html">
            <i class="bi bi-activity fs-5"></i> Triage Result
          </a>
          <a class="nav-link sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="payment.html">
            <i class="bi bi-credit-card fs-5"></i> Payment
          </a>
          <!-- Link Fixed: patient-profile.html -->
          <a class="nav-link sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="patient-profile.html">
            <i class="bi bi-person fs-5"></i> Profile
          </a>
        </nav>
      </div>

      <div class="d-flex align-items-center justify-content-between pt-3 border-top border-white-20">
        <div class="d-flex align-items-center gap-2">
          <div class="bg-white text-dark rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 38px; height: 38px;">
            <i class="bi bi-person-fill fs-5" style="color: #187D85;"></i>
          </div>
          <div>
            <div class="fw-bold lh-1 small text-white" id="sidebarUserName">Patient Name</div>
            <small class="text-white-50" style="font-size: 0.72rem;">Patient</small>
          </div>
        </div>
        <a href="patient-login.html" class="btn btn-sm btn-light rounded-pill px-3 fw-bold" style="color: #187D85; font-size: 0.8rem;">Log Out</a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-grow-1 d-flex flex-column" style="background: linear-gradient(135deg, #e0f2fe 0%, #ccfbf1 100%);">
      
      <!-- Top Navigation Header -->
      <header class="bg-white py-3 px-4 shadow-sm d-flex justify-content-between align-items-center">
        <div class="fw-semibold text-secondary" style="font-size: 0.95rem;">
          Patient <i class="bi bi-chevron-right mx-1 small"></i> <span style="color: #187D85;" class="fw-bold">Triage Result</span>
        </div>

        <div class="d-flex align-items-center gap-3">
          <div class="d-flex align-items-center gap-2 me-2">
            <div class="bg-light text-secondary rounded-circle d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
              <i class="bi bi-person-fill fs-5"></i>
            </div>
            <div class="text-end">
              <div class="fw-bold lh-1 small text-dark" id="headerUserName">Patient Name</div>
              <small class="text-muted" style="font-size: 0.7rem;">Patient</small>
            </div>
          </div>
          <button class="btn btn-sm text-white rounded-pill px-3" id="langToggle" style="background-color: #187D85; font-size: 0.8rem;">EN | বাং</button>
        </div>
      </header>

      <!-- Triage Result Card Container -->
      <div class="p-4 p-md-5 overflow-auto flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="bg-white rounded-4 shadow-lg p-4 p-md-5 max-w-3xl w-100 border-0">
          
          <h2 class="fw-bold fs-3 text-slate-800 mb-4">Your triage result</h2>

          <!-- Main Metric Cards -->
          <div class="bg-slate-50 p-4 rounded-4 mb-4 border border-slate-100">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <!-- Severity Score Badge -->
              <div class="bg-rose-50 px-3 py-2 rounded-3 text-center border border-rose-100">
                <span class="d-block fw-bold text-slate-800 fs-5" id="severityScoreVal">1</span>
                <small class="text-muted d-block" style="font-size: 0.65rem;">Severity score</small>
              </div>

              <!-- Pain Level Badge -->
              <div class="bg-amber-50 px-3 py-2 rounded-3 text-center border border-amber-100">
                <span class="d-block fw-bold text-slate-800 fs-5" id="painLevelVal">7/10</span>
                <small class="text-muted d-block" style="font-size: 0.65rem;">Pain level</small>
              </div>

              <!-- Speciality -->
              <div class="text-end">
                <small class="text-muted d-block" style="font-size: 0.75rem;">Speciality:</small>
                <span class="fw-bold text-slate-800" id="specialityVal">Cardiology</span>
              </div>
            </div>

            <!-- Triage Status Progress Bar Indicator -->
            <div class="position-relative rounded-pill overflow-hidden d-flex text-white fw-bold align-items-center px-4" id="triageStatusBanner" style="height: 48px; background-color: #991b1b;">
              <span id="triageCategoryText" class="fs-6">Urgent</span>
              <span class="ms-auto bg-white/20 px-3 py-1 rounded-pill text-white small" style="font-size: 0.75rem;">Your case</span>
            </div>
          </div>

          <!-- Severity Scale Visualization -->
          <div class="bg-slate-50 p-4 rounded-4 mb-4 border border-slate-100">
            <p class="fw-bold text-slate-700 small mb-2">Severity scale</p>
            
            <div class="severity-bar-container">
              <div class="severity-step step-1" id="step1"></div>
              <div class="severity-step step-2" id="step2"></div>
              <div class="severity-step step-3" id="step3"></div>
              <div class="severity-step step-4" id="step4"></div>
              <div class="severity-step step-5" id="step5"></div>
            </div>

            <div class="d-flex justify-content-between mt-2 text-muted fw-semibold" style="font-size: 0.72rem;">
              <span>5- Non-urgent</span>
              <span>1- Critical</span>
            </div>
          </div>

          <!-- Action Button -->
          <div class="text-end">
            <a href="payment.html" id="actionBtn" class="btn text-white px-4 py-3 rounded-3 fw-bold fs-6 shadow-sm" style="background-color: #187D85;">
              Proceed to Payment
            </a>
          </div>

        </div>
      </div>

    </main>

  </div>

  <!-- JS Libraries & Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/api.js"></script>
  <script src="js/triage-ui-controller.js"></script>

  <!-- Language Switch Script -->
  <script>
    document.getElementById('langToggle')?.addEventListener('click', function () {
      this.textContent = this.textContent.trim().startsWith('EN') ? 'বাং | EN' : 'EN | বাং';
    });
  </script>

</body>
</html>
