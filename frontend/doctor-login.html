<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Log In — TeleTriage</title>

  <!-- Bootstrap 5.3.8 & Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Link to your project CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Exact Teal Tint Overlay over texture.jpg from patient-login */
    .doctor-hero-bg {
      background-image: 
        linear-gradient(180deg, rgba(33, 203, 181, 0.75) 0%, rgba(24, 125, 133, 0.9) 100%),
        url("img/texture.jpg");
      background-size: cover;
      background-position: center;
      background-blend-mode: multiply;
      min-height: 100vh;
    }

    .login-form-wrapper {
      max-width: 420px;
      width: 100%;
    }
  </style>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-0 m-0">

  <div class="container-fluid min-vh-100 p-0">
    <div class="row g-0 min-vh-100">
      
      <!-- Left Side: Brand Background with Blend -->
      <div class="col-lg-6 doctor-hero-bg d-flex flex-column justify-content-between p-4 p-md-5 text-white">
        
        <!-- Header Brand & Lang Switcher -->
        <div class="d-flex justify-content-between align-items-center">
          <a href="index.html" class="d-flex align-items-center text-decoration-none text-white fs-3 fw-bold">
            <i class="bi bi-plus-square-fill fs-2 me-2"></i> TeleTriage
          </a>
          <button class="btn btn-sm text-white rounded-pill px-3 border border-white-50 lang-btn">
            EN | বাং
          </button>
        </div>

        <!-- Center Doctor Illustration (Exact file path: img/doc_log-in.png) -->
        <div class="my-auto text-center py-4">
          <img src="img/doc_log-in.png" 
               alt="Doctor Illustration" 
               class="img-fluid mx-auto login-hero-img" 
               style="max-height: 420px;">
        </div>

        <!-- Bottom Tagline -->
        <div class="text-center text-white-50 small">
          Authorized Doctor Portal Access
        </div>
      </div>

      <!-- Right Side: Login Form Panel -->
      <div class="col-lg-6 bg-white d-flex align-items-center justify-content-center p-4 p-md-5">
        <div class="login-form-wrapper">
          
          <div class="mb-5">
            <h1 class="brand-teal fw-bold display-6 mb-2">Doctor Log In</h1>
            <p class="text-secondary fs-5">Welcome back!</p>
          </div>

          <form id="doctorLoginForm">
            <!-- Alert Container for Errors -->
            <div id="loginAlert" class="alert alert-danger d-none rounded-3 py-2 px-3 mb-3 small" role="alert"></div>

            <!-- Doctor ID / Reg Input -->
            <div class="mb-4">
              <input type="text" class="form-control form-control-lg py-3 rounded-3 fs-6 input-gray" id="doctorId" placeholder="Doctor ID/ Registration No." required>
            </div>

            <!-- Password Input -->
            <div class="mb-3 position-relative">
              <input type="password" class="form-control form-control-lg py-3 rounded-3 fs-6 pe-5 input-gray" id="doctorPassword" placeholder="Password" required>
              <button type="button" id="togglePasswordBtn" class="btn border-0 position-absolute end-0 top-50 translate-middle-y me-2 text-secondary">
                <i class="bi bi-eye" id="toggleEyeIcon"></i>
              </button>
            </div>

            <!-- Forgot Password Link -->
            <div class="text-end mb-4">
              <a href="#" class="brand-teal text-decoration-none fw-semibold small">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-teal btn-lg w-100 py-3 rounded-3 fw-bold fs-5 shadow-sm">
              Log In
            </button>
          </form>

        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/doctor-login-controller.js"></script>
</body>
</html>
