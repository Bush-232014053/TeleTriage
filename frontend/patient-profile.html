<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Profile — TeleTriage</title>

  <!-- Bootstrap 5.3 & Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <style>
    .sidebar-bg {
      background: linear-gradient(rgba(24, 125, 133, 0.85), rgba(24, 125, 133, 0.85)), url('img/texture.jpg');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body class="overflow-x-hidden" style="background-color: #E6F8F6;" data-i18n-auto>
  <div class="position-fixed top-0 end-0 p-3" style="z-index:9999"><button type="button" class="btn btn-sm text-white rounded-pill px-3" id="langToggle" style="background-color:#187D85;font-size:0.8rem;">EN | বাং</button></div>

  <div class="d-flex min-vh-100">
    
    <!-- Sidebar with Texture Image -->
    <aside class="sidebar-bg p-4 d-flex flex-column justify-content-between text-white" style="width: 260px;">
      <div>
        <!-- Logo -->
        <div class="d-flex align-items-center gap-2 mb-5">
          <i class="bi bi-plus-square-fill fs-3"></i>
          <span class="fw-bold fs-4 tracking-wide">TeleTriage</span>
        </div>

        <!-- Navigation Links -->
        <nav class="nav nav-pills flex-column gap-2">
          <a href="patient-dashboard.html" class="nav-link text-white opacity-75 hover:opacity-100 d-flex align-items-center gap-3 px-3 py-2.5 rounded-3">
            <i class="bi bi-house-door-fill"></i> Dashboard
          </a>
          <a href="symptom-form.html" class="nav-link text-white opacity-75 hover:opacity-100 d-flex align-items-center gap-3 px-3 py-2.5 rounded-3">
            <i class="bi bi-clipboard2-pulse"></i> Symptom Form
          </a>
          <a href="triage-result.html" class="nav-link text-white opacity-75 hover:opacity-100 d-flex align-items-center gap-3 px-3 py-2.5 rounded-3">
            <i class="bi bi-activity"></i> Triage Result
          </a>
          <a href="payment.html" class="nav-link text-white opacity-75 hover:opacity-100 d-flex align-items-center gap-3 px-3 py-2.5 rounded-3">
            <i class="bi bi-credit-card"></i> Payment
          </a>
          <a href="patient-profile.html" class="nav-link active bg-white/20 text-white fw-bold d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 shadow-sm">
            <i class="bi bi-person"></i> Profile
          </a>
        </nav>
      </div>

      <!-- User Profile Card & Logout -->
      <div class="pt-4 border-top border-white border-opacity-25">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="rounded-circle bg-white text-dark d-flex align-items-center justify-content-center fw-bold" style="width: 35px; height: 35px; color: #187D85;">
            <i class="bi bi-person-fill"></i>
          </div>
          <div>
            <h6 class="fw-bold mb-0 text-white small">Patient</h6>
            <small class="text-white-50" style="font-size: 11px;">Patient</small>
          </div>
        </div>
        <a href="patient-login.html" class="btn btn-light btn-sm w-auto px-3 fw-semibold rounded-pill py-1.5 text-slate-700">
          Log Out
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-grow-1 p-4 p-md-5">
      
      <!-- Top Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-2 text-muted small">
          <span>Patient</span> <i class="bi bi-chevron-right fs-xs"></i> <span class="text-teal-700 fw-semibold">Profile</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="rounded-circle bg-white p-2 border shadow-sm d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
            <i class="bi bi-person"></i>
          </span>
          <span class="fw-semibold text-slate-700 small">Patient</span>
          <button class="btn btn-sm btn-teal text-white rounded-3 px-2 py-0.5 ms-2" style="background-color: #187D85; font-size: 11px;">EN | বাং</button>
        </div>
      </div>

      <!-- Main Profile Card -->
      <div class="bg-white rounded-4 shadow-sm p-4 p-md-5 border">
        
        <!-- Profile Header Avatar -->
        <div class="d-flex align-items-center gap-4 mb-4 pb-4 border-bottom">
          <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold fs-2 shadow-sm" style="width: 75px; height: 75px; background-color: #187D85;">
            <i class="bi bi-person-fill"></i>
          </div>
          <div>
            <h4 class="fw-bold text-slate-800 mb-1">John Doe</h4>
            <span class="badge bg-slate-100 text-slate-600 font-mono">Patient ID: #PT-9042</span>
          </div>
        </div>

        <!-- Edit Form -->
        <form id="patientProfileForm">
          <h5 class="fw-bold text-slate-700 mb-3 fs-6 text-uppercase tracking-wider">Personal Information</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Full Name</label>
              <input type="text" class="form-control bg-slate-100 border-0 rounded-3 py-2.5" value="John Doe" required>
            </div>
            <div class="col-md-3">
              <label class="form-label text-muted small fw-semibold">Age</label>
              <input type="number" class="form-control bg-slate-100 border-0 rounded-3 py-2.5" value="32" required>
            </div>
            <div class="col-md-3">
              <label class="form-label text-muted small fw-semibold">Gender</label>
              <select class="form-select bg-slate-100 border-0 rounded-3 py-2.5">
                <option value="Male" selected>Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Blood Group</label>
              <select class="form-select bg-slate-100 border-0 rounded-3 py-2.5">
                <option value="A+">A+</option>
                <option value="B+" selected>B+</option>
                <option value="O+">O+</option>
                <option value="AB+">AB+</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Phone Number</label>
              <input type="tel" class="form-control bg-slate-100 border-0 rounded-3 py-2.5" value="+880 1712 345678" required>
            </div>
          </div>

          <h5 class="fw-bold text-slate-700 mb-3 fs-6 text-uppercase tracking-wider">Emergency & Medical Information</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Emergency Contact Name</label>
              <input type="text" class="form-control bg-slate-100 border-0 rounded-3 py-2.5" value="Jane Doe (Spouse)">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Emergency Contact Phone</label>
              <input type="tel" class="form-control bg-slate-100 border-0 rounded-3 py-2.5" value="+880 1812 987654">
            </div>
            <div class="col-12">
              <label class="form-label text-muted small fw-semibold">Known Allergies / Chronic Illnesses</label>
              <textarea class="form-control bg-slate-100 border-0 rounded-3" rows="3">Dust allergy, Mild Asthma</textarea>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-3 pt-3 border-top">
            <a href="patient-dashboard.html" class="btn btn-light px-4 rounded-pill fw-semibold">Cancel</a>
            <button type="submit" class="btn text-white px-5 rounded-pill fw-semibold shadow-sm" style="background-color: #187D85;">
              <i class="bi bi-check2-circle me-1"></i> Save Changes
            </button>
          </div>
        </form>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/profile-controller.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
