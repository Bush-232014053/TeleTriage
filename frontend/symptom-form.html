<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Symptom Submission — TeleTriage</title>

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Google Fonts (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom App Styles -->
  <link rel="stylesheet" href="css/style.css?v=2.7">
</head>
<body class="bg-light" data-i18n-auto>

  <div class="d-flex min-vh-100 overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="brand-bg text-white d-flex flex-column justify-content-between p-4" style="width: 260px; min-width: 260px;">
      <div>
        <!-- Brand Logo -->
        <a class="d-flex align-items-center text-decoration-none text-white mb-5" href="index.html">
          <i class="bi bi-plus-square-fill fs-2 me-2"></i>
          <span class="fs-3 fw-bold" style="font-family: 'Poppins', sans-serif;">TeleTriage</span>
        </a>

        <!-- Sidebar Navigation Links -->
        <nav class="nav flex-column gap-2">
          <a class="nav-link sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="patient-dashboard.html">
            <i class="bi bi-house-door fs-5"></i> Dashboard
          </a>
          <a class="nav-link sidebar-link active d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="symptom-form.html">
            <i class="bi bi-file-earmark-text fs-5"></i> Symptom Form
          </a>
          <a class="nav-link sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="triage-result.html">
            <i class="bi bi-activity fs-5"></i> Triage Result
          </a>
          <a class="nav-link sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="payment.html">
            <i class="bi bi-credit-card fs-5"></i> Payment
          </a>
          <!-- Link Fixed: patient-profile.html -->
          <a class="nav-link sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3" href="patient-profile.html">
            <i class="bi bi-person fs-5"></i> Profile
          </a>
        </nav>
      </div>

      <!-- User Profile Summary at Bottom Sidebar -->
      <div class="d-flex align-items-center justify-content-between pt-3 border-top border-white-20">
        <div class="d-flex align-items-center gap-2">
          <div class="bg-white text-dark rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 38px; height: 38px;">
            <i class="bi bi-person-fill fs-5" style="color: #187D85;"></i>
          </div>
          <div>
            <div class="fw-bold lh-1 small text-white" id="sidebarUserName">YYYYYY</div>
            <small class="text-white-50" style="font-size: 0.72rem;">Patient</small>
          </div>
        </div>
        <a href="index.html" data-logout class="btn btn-sm btn-light rounded-pill px-3 fw-bold" style="color: #187D85; font-size: 0.8rem;">Log Out</a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-grow-1 d-flex flex-column" style="background: linear-gradient(135deg, #e0f2fe 0%, #ccfbf1 100%);">
      
      <!-- Top Navigation Header -->
      <header class="bg-white py-3 px-4 shadow-sm d-flex justify-content-between align-items-center">
        <!-- Breadcrumb Navigation -->
        <div class="fw-semibold text-secondary" style="font-size: 0.95rem;">
          Patient <i class="bi bi-chevron-right mx-1 small"></i> <span style="color: #187D85;" class="fw-bold">Symptom Submission</span>
        </div>

        <!-- Right Header Items -->
        <div class="d-flex align-items-center gap-3">
          <div class="d-flex align-items-center gap-2 me-2">
            <div class="bg-light text-secondary rounded-circle d-flex align-items-center justify-content-center" style="width: 35px; height: 35px;">
              <i class="bi bi-person-fill fs-5"></i>
            </div>
            <div class="text-end">
              <div class="fw-bold lh-1 small text-dark" id="headerUserName">YYYYYY</div>
              <small class="text-muted" style="font-size: 0.7rem;">Patient</small>
            </div>
          </div>
          
          <button class="btn btn-sm text-white rounded-pill px-3" id="langToggle" style="background-color: #187D85; font-size: 0.8rem;">EN | বাং</button>
        </div>
      </header>

      <!-- Form Container Area -->
      <div class="p-4 p-md-5 overflow-auto flex-grow-1">
        <div class="bg-white rounded-4 shadow-sm p-4 p-md-5 mx-auto" style="max-width: 900px;">
          
          <h4 class="fw-bold mb-4" style="color: #187D85;" data-i18n="symptom.details">Symptom Details</h4>

          <form id="symptomForm">
            <!-- Chief Complaint -->
            <div class="mb-4">
              <label for="chiefComplaint" class="form-label fw-bold" style="color: #187D85;" data-i18n="symptom.chiefComplaint.label">Chief Complaint:</label>
              <textarea id="chiefComplaint" class="form-control custom-input rounded-3" rows="3" data-i18n-placeholder="symptom.chiefComplaint.ph" placeholder="Describe your chief symptom....." required></textarea>
            </div>

            <!-- Custom Editable Inputs: Duration & Body Location + Pain Level Slider -->
            <div class="row g-3 mb-4">
              
              <!-- Editable Custom Input with Datalist Options for Duration -->
              <div class="col-md-4">
                <label for="duration" class="form-label fw-bold" style="color: #187D85;" data-i18n="symptom.duration.label">Duration:</label>
                <input type="text" id="duration" list="durationOptions" class="form-control custom-input rounded-3" data-i18n-placeholder="symptom.duration.ph" placeholder="e.g., sudden, 1-3 days" required>
                <datalist id="durationOptions">
                  <option value="sudden">Sudden / Less than 24h</option>
                  <option value="today">Today</option>
                  <option value="1-3-days">1-3 days</option>
                  <option value="1-2-weeks">1-2 weeks</option>
                  <option value="chronic">Chronic (1 month+)</option>
                </datalist>
              </div>

              <!-- Editable Custom Input with Datalist Options for Body Location -->
              <div class="col-md-4">
                <label for="bodyLocation" class="form-label fw-bold" style="color: #187D85;" data-i18n="symptom.bodyLocation.label">Body Location:</label>
                <input type="text" id="bodyLocation" list="bodyLocationOptions" class="form-control custom-input rounded-3" data-i18n-placeholder="symptom.bodyLocation.ph" placeholder="e.g., Chest, Back" required>
                <datalist id="bodyLocationOptions">
                  <option value="Head / Neck"></option>
                  <option value="Chest / Back"></option>
                  <option value="Abdomen"></option>
                  <option value="Arms / Legs"></option>
                </datalist>
              </div>

              <!-- Pain Level Slider -->
              <div class="col-md-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="painLevel" class="form-label fw-bold mb-0" style="color: #187D85;" data-i18n="symptom.painLevel.label">Pain Level:</label>
                  <span class="fw-bold" style="color: #187D85;" id="painValue">6 / 10</span>
                </div>
                <input type="range" class="form-range mt-2" id="painLevel" min="1" max="10" value="6">
                <div class="d-flex justify-content-between small text-muted">
                  <span>1</span>
                  <span>10</span>
                </div>
              </div>
            </div>

            <!-- Additional Notes -->
            <div class="mb-4">
              <label for="additionalNotes" class="form-label fw-bold" style="color: #187D85;" data-i18n="symptom.notes.label">Additional Notes:</label>
              <textarea id="additionalNotes" class="form-control custom-input rounded-3" rows="3" data-i18n-placeholder="symptom.notes.ph" placeholder="Any additional details or medical history......"></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-end gap-3 mt-5">
              <button type="button" class="btn btn-outline-secondary px-4 py-2 rounded-3 fw-bold" data-i18n="symptom.saveDraft">Save Draft</button>
              <button type="submit" class="btn text-white px-4 py-2 rounded-3 fw-bold" style="background-color: #187D85;" data-i18n="symptom.continue">Continue</button>
            </div>

          </form>

        </div>
      </div>

    </main>

  </div>

  <!-- External JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  
  <script>
    // 1. Update Pain Level slider text
    const painLevelInput = document.getElementById('painLevel');
    const painValueDisplay = document.getElementById('painValue');

    if (painLevelInput && painValueDisplay) {
      painLevelInput.addEventListener('input', function() {
        painValueDisplay.textContent = `${this.value} / 10`;
      });
    }

    // Form Submission — send to backend triage API
    document.getElementById('symptomForm')?.addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!TeleTriageAPI.getToken()) {
        alert('Please log in first.');
        window.location.href = 'patient-login.html';
        return;
      }

      const payload = {
        chiefComplaint: document.getElementById('chiefComplaint').value.trim(),
        duration: document.getElementById('duration').value,
        bodyLocation: document.getElementById('bodyLocation').value.trim(),
        painLevel: Number(document.getElementById('painLevel').value),
        notes: document.getElementById('additionalNotes').value.trim()
      };

      const submitBtn = this.querySelector('button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';
      }

      try {
        const data = await TeleTriageAPI.request('/api/patients/symptoms', {
          method: 'POST',
          body: JSON.stringify(payload),
        });

        sessionStorage.setItem('teletriage_submission_id', String(data.submissionId));
        sessionStorage.removeItem('teletriage_selected_doctor_id');
        sessionStorage.removeItem('teletriage_selected_doctor');
        sessionStorage.setItem('teletriage_triage', JSON.stringify({
          ...data.triage,
          painLevel: payload.painLevel,
          chiefComplaint: payload.chiefComplaint,
        }));
        sessionStorage.setItem('teletriage_fee', '100');

        window.location.href = 'triage-result.html';
      } catch (err) {
        alert(err.message || 'Failed to submit symptoms.');
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit Symptoms';
        }
      }
    });
  </script>
  <script src="js/i18n.js"></script>
</body>
</html>
