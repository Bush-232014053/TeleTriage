<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Profile — TeleTriage</title>

  <!-- Bootstrap 5.3 & Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <style>
    .sidebar-bg {
      background: linear-gradient(rgba(24, 125, 133, 0.85), rgba(24, 125, 133, 0.85)), url('img/texture.jpg');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body class="overflow-x-hidden" style="background-color: #E6F8F6;">

  <div class="d-flex min-vh-100">
    
    <!-- Sidebar with Texture Image -->
    <aside class="sidebar-bg p-4 d-flex flex-column justify-content-between text-white" style="width: 260px;">
      <div>
        <!-- Logo -->
        <div class="d-flex align-items-center gap-2 mb-5">
          <i class="bi bi-plus-square-fill fs-3"></i>
          <span class="fw-bold fs-4 tracking-wide">TeleTriage</span>
        </div>

        <!-- Navigation Links -->
        <nav class="nav nav-pills flex-column gap-2">
          <a href="doctor-dashboard.html" class="nav-link text-white opacity-75 hover:opacity-100 d-flex align-items-center gap-3 px-3 py-2.5 rounded-3">
            <i class="bi bi-grid-1x2-fill"></i> Dashboard
          </a>
          <a href="priority-queue.html" class="nav-link text-white opacity-75 hover:opacity-100 d-flex align-items-center gap-3 px-3 py-2.5 rounded-3">
            <i class="bi bi-list-stars"></i> Live Urgent Queue
          </a>
          <a href="doctor-schedule.html" class="nav-link text-white opacity-75 hover:opacity-100 d-flex align-items-center gap-3 px-3 py-2.5 rounded-3">
            <i class="bi bi-calendar2-week"></i> Fixed Appointments
          </a>
          <a href="case-history.html" class="nav-link text-white opacity-75 hover:opacity-100 d-flex align-items-center gap-3 px-3 py-2.5 rounded-3">
            <i class="bi bi-folder2-open"></i> Case History
          </a>
          <a href="doctor-profile.html" class="nav-link active bg-white/20 text-white fw-bold d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 shadow-sm">
            <i class="bi bi-person-badge"></i> Profile
          </a>
        </nav>
      </div>

      <!-- User Profile Card & Logout -->
      <div class="pt-4 border-top border-white border-opacity-25">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="rounded-circle bg-white text-dark d-flex align-items-center justify-content-center fw-bold" style="width: 35px; height: 35px; color: #187D85;">
            <i class="bi bi-person-fill"></i>
          </div>
          <div>
            <h6 class="fw-bold mb-0 text-white small">Dr. XXXXXX</h6>
            <small class="text-white-50" style="font-size: 11px;">Cardiologist</small>
          </div>
        </div>
        <a href="doctor-login.html" class="btn btn-light btn-sm w-auto px-3 fw-semibold rounded-pill py-1.5 text-slate-700">
          Log Out
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-grow-1 p-4 p-md-5">
      
      <!-- Top Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold text-slate-800 mb-1">Doctor Profile</h3>
          <p class="text-muted small mb-0">Update your professional information and consultation details</p>
        </div>
      </div>

      <!-- Main Profile Card -->
      <div class="bg-white rounded-4 shadow-sm p-4 p-md-5 border">
        
        <!-- Profile Header Avatar -->
        <div class="d-flex align-items-center gap-4 mb-4 pb-4 border-bottom">
          <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold fs-2 shadow-sm" style="width: 75px; height: 75px; background-color: #187D85;">
            <i class="bi bi-person-badge-fill"></i>
          </div>
          <div>
            <h4 class="fw-bold text-slate-800 mb-1">Dr. Alex Rivera</h4>
            <p class="text-muted small mb-0">Cardiologist • Reg No: #BMDC-88410</p>
          </div>
        </div>

        <!-- Edit Form -->
        <form id="doctorProfileForm">
          <h5 class="fw-bold text-slate-700 mb-3 fs-6 text-uppercase tracking-wider">Professional Information</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Doctor Name</label>
              <input type="text" class="form-control bg-slate-100 border-0 rounded-3 py-2.5" value="Dr. Alex Rivera" required>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Specialization</label>
              <input type="text" class="form-control bg-slate-100 border-0 rounded-3 py-2.5" value="Cardiologist" required>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">BMDC Registration No.</label>
              <input type="text" class="form-control bg-slate-100 border-0 rounded-3 py-2.5" value="BMDC-88410" required>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Consultation Fee (BDT)</label>
              <input type="number" class="form-control bg-slate-100 border-0 rounded-3 py-2.5" value="800" required>
            </div>
          </div>

          <h5 class="fw-bold text-slate-700 mb-3 fs-6 text-uppercase tracking-wider">Contact & Chamber Info</h5>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Email Address</label>
              <input type="email" class="form-control bg-slate-100 border-0 rounded-3 py-2.5" value="alex.rivera@teletriage.com" required>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-semibold">Phone Number</label>
              <input type="tel" class="form-control bg-slate-100 border-0 rounded-3 py-2.5" value="+880 1911 000111" required>
            </div>
            <div class="col-12">
              <label class="form-label text-muted small fw-semibold">Hospital / Chamber Address</label>
              <input type="text" class="form-control bg-slate-100 border-0 rounded-3 py-2.5" value="Square Hospital, West Panthapath, Dhaka">
            </div>
          </div>

          <div class="d-flex justify-content-end gap-3 pt-3 border-top">
            <a href="doctor-dashboard.html" class="btn btn-light px-4 rounded-pill fw-semibold">Cancel</a>
            <button type="submit" class="btn text-white px-5 rounded-pill fw-semibold shadow-sm" style="background-color: #187D85;">
              <i class="bi bi-shield-check me-1"></i> Update Profile
            </button>
          </div>
        </form>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/profile-controller.js"></script>
</body>
</html>
